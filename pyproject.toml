[project]
name = "obs-audio-sync"
version = "0.1.0"
description = "Automatic synchronization of multiple audio tracks in OBS via onset-based audio alignment"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.10",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "obsws-python>=1.7",
    "pyqtgraph>=0.13",
    "pydantic>=2.7",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-qt>=4.4",
    "pyinstaller>=6.10",
]

[project.scripts]
obs-audio-sync = "obs_audio_sync.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
